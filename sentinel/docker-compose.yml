# Sentinel - Docker Compose Configuration
# ===============================================
# Autonomous, self-healing security daemon for Linux
#
# Usage:
#   docker-compose up -d                    # Start Sentinel
#   docker-compose logs -f sentinel  # Watch logs
#   docker-compose exec sentinel python3 /opt/sentinel/daemon.py  # Manual scan

services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel
    hostname: sentinel
    restart: unless-stopped

    # Required for security scanning
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
      - AUDIT_CONTROL

    # Environment variables
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SENTINEL_LOG_LEVEL=INFO
      - TZ=UTC

    # Volumes for persistence
    volumes:
      - sentinel-data:/opt/sentinel/data
      - sentinel-logs:/var/log/sentinel
      - sentinel-baseline:/opt/sentinel/baseline
      - ./config:/opt/sentinel/config:ro

    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "-f", "daemon.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Threat Intel API
  threat-intel-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sentinel-threat-intel
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - sentinel-data:/opt/sentinel/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sentinel-data:
    driver: local
  sentinel-logs:
    driver: local
  sentinel-baseline:
    driver: local
