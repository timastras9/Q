# Modern Enterprise Vulnerable Lab
# Simulates realistic corporate security posture circa 2024
# Contains: Cloud-native apps, CI/CD, legacy systems, misconfigurations

services:
  # ============================================
  # TIER 1: EXTERNAL FACING (DMZ)
  # ============================================

  # Modern Node.js API with JWT vulnerabilities
  vulnerable-api:
    build:
      context: ./services/vulnerable-api
      dockerfile: Dockerfile
    container_name: lab-api
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=super-secret-key-123
      - DEBUG=true
      - NODE_ENV=development
    restart: unless-stopped

  # WordPress with outdated plugins (common in enterprises)
  wordpress:
    image: wordpress:5.9-php7.4-apache
    container_name: lab-wordpress
    ports:
      - "8080:80"
    environment:
      - WORDPRESS_DB_HOST=mysql
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress123
      - WORDPRESS_DB_NAME=wordpress
    depends_on:
      - mysql
    restart: unless-stopped

  # Nginx reverse proxy with misconfigurations
  nginx-proxy:
    build:
      context: ./services/nginx-proxy
      dockerfile: Dockerfile
    container_name: lab-nginx
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  # ============================================
  # TIER 2: INTERNAL SERVICES
  # ============================================

  # Jenkins CI/CD (often exposed, misconfigured)
  jenkins:
    image: jenkins/jenkins:lts
    container_name: lab-jenkins
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

  # GitLab (exposed git repos, CI tokens)
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: lab-gitlab
    ports:
      - "8929:80"
      - "8922:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['initial_root_password'] = 'password123'
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    restart: unless-stopped

  # Grafana dashboard (default creds, data exposure)
  grafana:
    image: grafana/grafana:9.0.0
    container_name: lab-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    restart: unless-stopped

  # Elasticsearch (often exposed without auth)
  elasticsearch:
    image: elasticsearch:7.17.0
    container_name: lab-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    restart: unless-stopped

  # Kibana (exposed dashboards)
  kibana:
    image: kibana:7.17.0
    container_name: lab-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ============================================
  # TIER 3: DATABASE LAYER
  # ============================================

  # MySQL (weak password, exposed, with hash tables)
  mysql:
    image: mysql:8.0
    container_name: lab-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./services/mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  # MongoDB (no auth - common misconfiguration)
  mongodb:
    image: mongo:5.0
    container_name: lab-mongodb
    ports:
      - "27017:27017"
    # No authentication - vulnerable!
    restart: unless-stopped

  # Redis (no auth, accessible)
  redis:
    image: redis:7-alpine
    container_name: lab-redis
    ports:
      - "6379:6379"
    # No password - vulnerable!
    restart: unless-stopped

  # PostgreSQL (weak creds)
  postgres:
    image: postgres:14
    container_name: lab-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=enterprise
    restart: unless-stopped

  # ============================================
  # TIER 4: LEGACY SYSTEMS
  # ============================================

  # Apache with mod_status exposed (info leak)
  apache-legacy:
    build:
      context: ./services/apache-legacy
      dockerfile: Dockerfile
    container_name: lab-apache-legacy
    ports:
      - "8082:80"
    restart: unless-stopped

  # PHP application with SQLi, XSS, LFI
  php-legacy:
    build:
      context: ./services/php-legacy
      dockerfile: Dockerfile
    container_name: lab-php-legacy
    ports:
      - "8083:80"
    restart: unless-stopped

  # Tomcat with manager exposed
  tomcat:
    image: tomcat:9.0
    container_name: lab-tomcat
    ports:
      - "8084:8080"
    environment:
      - CATALINA_OPTS=-Xmx512m
    restart: unless-stopped

  # ============================================
  # TIER 5: INFRASTRUCTURE
  # ============================================

  # SSH with weak credentials
  ssh-server:
    image: linuxserver/openssh-server
    container_name: lab-ssh
    ports:
      - "2222:2222"
    environment:
      - USER_NAME=admin
      - USER_PASSWORD=admin123
      - PASSWORD_ACCESS=true
    restart: unless-stopped

  # FTP with anonymous access
  ftp-server:
    image: fauria/vsftpd
    container_name: lab-ftp
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    environment:
      - FTP_USER=ftpuser
      - FTP_PASS=ftppass123
      - PASV_ADDRESS=127.0.0.1
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
    restart: unless-stopped

  # MinIO (S3-compatible, misconfigured)
  minio:
    image: minio/minio
    container_name: lab-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # Docker Registry (exposed without auth)
  registry:
    image: registry:2
    container_name: lab-registry
    ports:
      - "5000:5000"
    restart: unless-stopped

  # ============================================
  # TIER 8: GUARANTEED SHELL ACCESS SERVICES
  # ============================================

  # Backdoor shell service - always provides root access
  # This simulates a compromised service or malicious insider
  backdoor-shell:
    image: python:3.9-alpine
    container_name: lab-backdoor
    ports:
      - "4444:4444"
      - "31337:31337"
    command: >
      sh -c "apk add --no-cache socat busybox-extras netcat-openbsd &&
             echo 'Backdoor service running...' &&
             socat TCP-LISTEN:4444,reuseaddr,fork EXEC:/bin/sh,pty,stderr,setsid,sigint,sane &
             nc -lvkp 31337 -e /bin/sh &
             tail -f /dev/null"
    restart: unless-stopped

  # Redis with SSH key write capability (classic attack)
  redis-ssh-pwn:
    image: redis:7-alpine
    container_name: lab-redis-ssh
    ports:
      - "6380:6379"
    volumes:
      - redis_ssh_data:/root/.ssh
    command: >
      sh -c "apk add --no-cache openssh-server &&
             mkdir -p /root/.ssh && chmod 700 /root/.ssh &&
             ssh-keygen -A &&
             echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config &&
             echo 'root:toor' | chpasswd &&
             /usr/sbin/sshd &&
             redis-server --protected-mode no --dir /root/.ssh --dbfilename authorized_keys"
    restart: unless-stopped

  # WebSocket reverse shell listener
  ws-shell:
    image: python:3.9-slim
    container_name: lab-ws-shell
    ports:
      - "8888:8888"
    command: >
      sh -c "pip install websockets && python3 -c '
import asyncio
import websockets
import subprocess
import os

async def shell(websocket, path):
    print(f\"Connection from {websocket.remote_address}\")
    await websocket.send(\"Connected to backdoor shell. Type commands:\")
    async for message in websocket:
        try:
            result = subprocess.check_output(message, shell=True, stderr=subprocess.STDOUT, timeout=30)
            await websocket.send(result.decode())
        except subprocess.CalledProcessError as e:
            await websocket.send(f\"Error: {e.output.decode()}\")
        except Exception as e:
            await websocket.send(f\"Error: {str(e)}\")

async def main():
    async with websockets.serve(shell, \"0.0.0.0\", 8888):
        print(\"WebSocket shell listening on 8888\")
        await asyncio.Future()

asyncio.run(main())
'"
    restart: unless-stopped

  # Vulnerable Netcat service (simulates old school backdoor)
  netcat-backdoor:
    image: alpine:3.18
    container_name: lab-netcat
    ports:
      - "9999:9999"
    command: >
      sh -c "apk add --no-cache netcat-openbsd &&
             while true; do nc -l -p 9999 -e /bin/sh 2>/dev/null; done"
    restart: unless-stopped

  # ============================================
  # TIER 6: SECURITY TRAINING - WIRELESS & CRACKING
  # ============================================

  # Wireless Network Simulation with WPA2 cracking targets
  wireless-sim:
    build:
      context: ./services/wireless-sim
      dockerfile: Dockerfile
    container_name: lab-wireless-sim
    privileged: true
    ports:
      - "8085:80"
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - wireless_captures:/captures
      - ./services/wireless-sim/wordlists:/wordlists:ro
      - ./services/wireless-sim/sample-hashes:/hashes:ro
    restart: unless-stopped

  # Kali attack box for practicing (optional)
  kali-attacker:
    image: kalilinux/kali-rolling
    container_name: lab-kali
    privileged: true
    tty: true
    stdin_open: true
    command: /bin/bash -c "apt-get update && apt-get install -y nmap hydra john hashcat aircrack-ng metasploit-framework && tail -f /dev/null"
    volumes:
      - kali_data:/root
      - wireless_captures:/captures
    restart: unless-stopped

  # LDAP Server (Active Directory simulation)
  ldap:
    image: osixia/openldap:1.5.0
    container_name: lab-ldap
    ports:
      - "389:389"
      - "636:636"
    environment:
      - LDAP_ORGANISATION=Enterprise Corp
      - LDAP_DOMAIN=enterprise.local
      - LDAP_ADMIN_PASSWORD=admin123
    restart: unless-stopped

  # Samba/SMB share (Windows-like file shares)
  samba:
    image: dperson/samba
    container_name: lab-samba
    ports:
      - "139:139"
      - "445:445"
    environment:
      - USER=admin;admin123
      - USER2=guest;guest
      - SHARE=public;/share;yes;no;no;all
      - SHARE2=confidential;/confidential;no;no;no;admin
    volumes:
      - samba_public:/share
      - samba_confidential:/confidential
    restart: unless-stopped

  # SNMP server (network device simulation)
  snmp:
    image: polinux/snmpd
    container_name: lab-snmp
    ports:
      - "161:161/udp"
    environment:
      - SNMP_COMMUNITY=public
    restart: unless-stopped

  # ============================================
  # TIER 7: RPC SERVICES (Remote Procedure Call)
  # ============================================

  # NFS Server (Network File System - RPC-based)
  nfs-server:
    image: itsthenetwork/nfs-server-alpine:latest
    container_name: lab-nfs
    privileged: true
    ports:
      - "2049:2049"
      - "111:111"
      - "111:111/udp"
    environment:
      - SHARED_DIRECTORY=/nfsshare
      - SYNC=true
      - PERMITTED="*"
    volumes:
      - nfs_data:/nfsshare
    restart: unless-stopped

  # Portmapper/rpcbind (RPC service discovery)
  rpcbind:
    image: alpine:3.18
    container_name: lab-rpcbind
    ports:
      - "112:111"
      - "112:111/udp"
    command: >
      sh -c "apk add --no-cache rpcbind &&
             rpcbind -f -w"
    privileged: true
    restart: unless-stopped

  # NIS/YP Server (Yellow Pages - legacy RPC auth)
  nis-server:
    image: alpine:3.18
    container_name: lab-nis
    ports:
      - "713:713"
      - "714:714/udp"
    command: >
      sh -c "apk add --no-cache ypserv ypbind rpcbind &&
             echo 'admin:$$6$$rounds=5000$$saltsalt$$hashhash:1000:1000:Admin:/home/admin:/bin/bash' > /etc/passwd.yp &&
             echo 'enterprise.local' > /etc/defaultdomain &&
             rpcbind && ypserv -d"
    privileged: true
    restart: unless-stopped

  # XML-RPC Service (vulnerable to various attacks)
  xmlrpc:
    build:
      context: ./services/xmlrpc
      dockerfile: Dockerfile
    container_name: lab-xmlrpc
    ports:
      - "8086:8086"
    restart: unless-stopped

  # JSON-RPC Service (Ethereum/Web3 style)
  jsonrpc:
    build:
      context: ./services/jsonrpc
      dockerfile: Dockerfile
    container_name: lab-jsonrpc
    ports:
      - "8087:8087"
    restart: unless-stopped

  # gRPC Service (modern RPC with vulnerabilities)
  grpc-server:
    build:
      context: ./services/grpc
      dockerfile: Dockerfile
    container_name: lab-grpc
    ports:
      - "50051:50051"
    restart: unless-stopped

  # D-Bus over TCP (unusual but exploitable)
  dbus-tcp:
    image: alpine:3.18
    container_name: lab-dbus
    ports:
      - "55556:55556"
    command: >
      sh -c "apk add --no-cache dbus socat &&
             socat TCP-LISTEN:55556,fork,reuseaddr UNIX-CONNECT:/var/run/dbus/system_bus_socket &
             dbus-daemon --system --nofork"
    privileged: true
    restart: unless-stopped

  # Java RMI Registry (classic RPC attack surface)
  java-rmi:
    image: eclipse-temurin:11-jdk
    container_name: lab-rmi
    ports:
      - "1099:1099"
      - "9999:9999"
    command: >
      sh -c "cat > /tmp/VulnServer.java << 'JAVA'
      import java.rmi.*;
      import java.rmi.registry.*;
      import java.rmi.server.*;

      interface VulnService extends Remote {
          String execute(String cmd) throws RemoteException;
          String readFile(String path) throws RemoteException;
          String getSystemInfo() throws RemoteException;
      }

      class VulnServiceImpl extends UnicastRemoteObject implements VulnService {
          VulnServiceImpl() throws RemoteException { super(); }

          public String execute(String cmd) throws RemoteException {
              try {
                  Process p = Runtime.getRuntime().exec(cmd);
                  java.io.BufferedReader r = new java.io.BufferedReader(
                      new java.io.InputStreamReader(p.getInputStream()));
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = r.readLine()) != null) sb.append(line).append(\"\\n\");
                  return sb.toString();
              } catch (Exception e) { return e.toString(); }
          }

          public String readFile(String path) throws RemoteException {
              try {
                  return new String(java.nio.file.Files.readAllBytes(java.nio.file.Paths.get(path)));
              } catch (Exception e) { return e.toString(); }
          }

          public String getSystemInfo() throws RemoteException {
              return \"Java RMI Server v1.0\\nOS: \" + System.getProperty(\"os.name\") +
                     \"\\nUser: \" + System.getProperty(\"user.name\") +
                     \"\\nSecret API Key: sk-12345-admin-secret\";
          }
      }

      public class VulnServer {
          public static void main(String[] args) throws Exception {
              System.setProperty(\"java.rmi.server.hostname\", \"0.0.0.0\");
              LocateRegistry.createRegistry(1099);
              VulnService service = new VulnServiceImpl();
              Naming.rebind(\"rmi://0.0.0.0:1099/VulnService\", service);
              System.out.println(\"RMI Server running on port 1099\");
              Thread.sleep(Long.MAX_VALUE);
          }
      }
      JAVA
      cd /tmp && javac VulnServer.java && java -Djava.rmi.server.hostname=0.0.0.0 VulnServer"
    restart: unless-stopped

  # Microsoft RPC simulation (DCE/RPC style)
  msrpc-sim:
    image: python:3.9-slim
    container_name: lab-msrpc
    ports:
      - "135:135"
      - "593:593"
    command: >
      sh -c "pip install impacket && python3 -c '
      import socket
      import struct
      import os

      # Simple DCE/RPC endpoint mapper simulation
      s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
      s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
      s.bind((\"0.0.0.0\", 135))
      s.listen(5)
      print(\"MS-RPC Endpoint Mapper simulation on port 135\")

      # Fake RPC endpoints
      endpoints = [
          {\"uuid\": \"e1af8308-5d1f-11c9-91a4-08002b14a0fa\", \"name\": \"EPM\", \"version\": \"3.0\"},
          {\"uuid\": \"12345778-1234-abcd-ef00-0123456789ab\", \"name\": \"LSARPC\", \"version\": \"0.0\"},
          {\"uuid\": \"12345678-1234-abcd-ef00-0123456789ac\", \"name\": \"SAMR\", \"version\": \"1.0\"},
          {\"uuid\": \"367abb81-9844-35f1-ad32-98f038001003\", \"name\": \"SVCCTL\", \"version\": \"2.0\"},
          {\"uuid\": \"338cd001-2244-31f1-aaaa-900038001003\", \"name\": \"WINREG\", \"version\": \"1.0\"},
          {\"uuid\": \"4b324fc8-1670-01d3-1278-5a47bf6ee188\", \"name\": \"SRVSVC\", \"version\": \"3.0\"},
      ]

      while True:
          try:
              conn, addr = s.accept()
              data = conn.recv(4096)
              # Return fake endpoint list
              response = \"\\n\".join([f\"{e[chr(39)]uuid[chr(39)]}: {e[chr(39)]name[chr(39)]} v{e[chr(39)]version[chr(39)]}\" for e in endpoints])
              conn.send(response.encode())
              conn.close()
          except:
              pass
      '"
    restart: unless-stopped

  # Sun RPC (ONC RPC) - Classic Unix RPC
  sunrpc:
    image: alpine:3.18
    container_name: lab-sunrpc
    ports:
      - "113:111"
      - "113:111/udp"
      - "32765-32770:32765-32770"
    command: >
      sh -c "apk add --no-cache rpcbind nfs-utils &&
             echo '/share *(rw,sync,no_subtree_check,no_root_squash,insecure)' > /etc/exports &&
             mkdir -p /share && echo 'SECRET_DATA=admin_password_123' > /share/secret.txt &&
             rpcbind -w && rpc.nfsd && rpc.mountd &&
             exportfs -ra &&
             rpcinfo -p localhost &&
             tail -f /dev/null"
    privileged: true
    volumes:
      - sunrpc_share:/share
    restart: unless-stopped

volumes:
  wireless_captures:
  kali_data:
  samba_public:
  samba_confidential:
  jenkins_home:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  mysql_data:
  nfs_data:
  sunrpc_share:
  redis_ssh_data:

networks:
  default:
    name: enterprise-lab
