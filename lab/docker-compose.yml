# Modern Enterprise Vulnerable Lab
# Simulates realistic corporate security posture circa 2024
# Contains: Cloud-native apps, CI/CD, legacy systems, misconfigurations

services:
  # ============================================
  # TIER 1: EXTERNAL FACING (DMZ)
  # ============================================

  # Modern Node.js API with JWT vulnerabilities
  vulnerable-api:
    build:
      context: ./services/vulnerable-api
      dockerfile: Dockerfile
    container_name: lab-api
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=super-secret-key-123
      - DEBUG=true
      - NODE_ENV=development
    restart: unless-stopped

  # WordPress with outdated plugins (common in enterprises)
  wordpress:
    image: wordpress:5.9-php7.4-apache
    container_name: lab-wordpress
    ports:
      - "8080:80"
    environment:
      - WORDPRESS_DB_HOST=mysql
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress123
      - WORDPRESS_DB_NAME=wordpress
    depends_on:
      - mysql
    restart: unless-stopped

  # Nginx reverse proxy with misconfigurations
  nginx-proxy:
    build:
      context: ./services/nginx-proxy
      dockerfile: Dockerfile
    container_name: lab-nginx
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  # HTTPS API with sensitive data for SSL interception testing
  https-api:
    build:
      context: ./services/https-api
      dockerfile: Dockerfile
    container_name: lab-https-api
    ports:
      - "8443:8443"
    restart: unless-stopped

  # ============================================
  # TIER 2: INTERNAL SERVICES
  # ============================================

  # Jenkins CI/CD (often exposed, misconfigured)
  jenkins:
    image: jenkins/jenkins:lts
    container_name: lab-jenkins
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

  # GitLab (exposed git repos, CI tokens)
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: lab-gitlab
    ports:
      - "8929:80"
      - "8922:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['initial_root_password'] = 'password123'
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    restart: unless-stopped

  # Grafana dashboard (default creds, data exposure)
  grafana:
    image: grafana/grafana:9.0.0
    container_name: lab-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    restart: unless-stopped

  # Elasticsearch (often exposed without auth)
  elasticsearch:
    image: elasticsearch:7.17.0
    container_name: lab-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    restart: unless-stopped

  # Kibana (exposed dashboards)
  kibana:
    image: kibana:7.17.0
    container_name: lab-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ============================================
  # TIER 3: DATABASE LAYER
  # ============================================

  # MySQL (weak password, exposed, with hash tables)
  mysql:
    image: mysql:8.0
    container_name: lab-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./services/mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  # MongoDB (no auth - common misconfiguration)
  mongodb:
    image: mongo:5.0
    container_name: lab-mongodb
    ports:
      - "27017:27017"
    # No authentication - vulnerable!
    restart: unless-stopped

  # Redis (no auth, accessible)
  redis:
    image: redis:7-alpine
    container_name: lab-redis
    ports:
      - "6379:6379"
    # No password - vulnerable!
    restart: unless-stopped

  # PostgreSQL (weak creds)
  postgres:
    image: postgres:14
    container_name: lab-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=enterprise
    restart: unless-stopped

  # ============================================
  # TIER 4: LEGACY SYSTEMS
  # ============================================

  # Apache with mod_status exposed (info leak)
  apache-legacy:
    build:
      context: ./services/apache-legacy
      dockerfile: Dockerfile
    container_name: lab-apache-legacy
    ports:
      - "8082:80"
    restart: unless-stopped

  # PHP application with SQLi, XSS, LFI
  php-legacy:
    build:
      context: ./services/php-legacy
      dockerfile: Dockerfile
    container_name: lab-php-legacy
    ports:
      - "8083:80"
    restart: unless-stopped

  # Tomcat with manager exposed
  tomcat:
    image: tomcat:9.0
    container_name: lab-tomcat
    ports:
      - "8084:8080"
    environment:
      - CATALINA_OPTS=-Xmx512m
    restart: unless-stopped

  # ============================================
  # TIER 5: INFRASTRUCTURE
  # ============================================

  # SSH with weak credentials
  # Vulnerable SSH server with multiple privesc vectors
  ssh-server:
    build:
      context: ./services/vulnerable-ssh
      dockerfile: Dockerfile
    container_name: lab-ssh
    ports:
      - "2222:22"
    volumes:
      # Mount Docker socket for container escape demonstration
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true  # Enables additional escape vectors
    restart: unless-stopped

  # FTP with anonymous access
  ftp-server:
    image: fauria/vsftpd
    container_name: lab-ftp
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    environment:
      - FTP_USER=ftpuser
      - FTP_PASS=ftppass123
      - PASV_ADDRESS=127.0.0.1
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
    restart: unless-stopped

  # MinIO (S3-compatible, misconfigured)
  minio:
    image: minio/minio
    container_name: lab-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # Docker Registry (exposed without auth)
  registry:
    image: registry:2
    container_name: lab-registry
    ports:
      - "5000:5000"
    restart: unless-stopped

  # ============================================
  # TIER 8: GUARANTEED SHELL ACCESS SERVICES
  # ============================================

  # Backdoor shell service - always provides root access
  # This simulates a compromised service or malicious insider
  backdoor-shell:
    image: python:3.9-alpine
    container_name: lab-backdoor
    ports:
      - "4444:4444"
      - "31337:31337"
    command: >
      sh -c "apk add --no-cache socat busybox-extras netcat-openbsd &&
             echo 'Backdoor service running...' &&
             socat TCP-LISTEN:4444,reuseaddr,fork EXEC:/bin/sh,pty,stderr,setsid,sigint,sane &
             nc -lvkp 31337 -e /bin/sh &
             tail -f /dev/null"
    restart: unless-stopped

  # Redis with SSH key write capability (classic attack)
  redis-ssh-pwn:
    image: redis:7-alpine
    container_name: lab-redis-ssh
    ports:
      - "6380:6379"
    volumes:
      - redis_ssh_data:/root/.ssh
    command: >
      sh -c "apk add --no-cache openssh-server &&
             mkdir -p /root/.ssh && chmod 700 /root/.ssh &&
             ssh-keygen -A &&
             echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config &&
             echo 'root:toor' | chpasswd &&
             /usr/sbin/sshd &&
             redis-server --protected-mode no --dir /root/.ssh --dbfilename authorized_keys"
    restart: unless-stopped

  # WebSocket reverse shell listener
  ws-shell:
    build:
      context: ./services/ws-shell
      dockerfile: Dockerfile
    container_name: lab-ws-shell
    ports:
      - "8888:8888"
    restart: unless-stopped

  # Vulnerable Netcat service (simulates old school backdoor)
  netcat-backdoor:
    image: alpine:3.18
    container_name: lab-netcat
    ports:
      - "9999:9999"
    command: >
      sh -c "apk add --no-cache netcat-openbsd &&
             while true; do nc -l -p 9999 -e /bin/sh 2>/dev/null; done"
    restart: unless-stopped

  # ============================================
  # TIER 6: SECURITY TRAINING - WIRELESS & CRACKING
  # ============================================

  # Wireless Network Simulation with WPA2 cracking targets
  wireless-sim:
    build:
      context: ./services/wireless-sim
      dockerfile: Dockerfile
    container_name: lab-wireless-sim
    privileged: true
    ports:
      - "8085:80"
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - wireless_captures:/captures
      - ./services/wireless-sim/wordlists:/wordlists:ro
      - ./services/wireless-sim/sample-hashes:/hashes:ro
    restart: unless-stopped

  # Kali attack box for practicing (optional)
  kali-attacker:
    image: kalilinux/kali-rolling
    container_name: lab-kali
    privileged: true
    tty: true
    stdin_open: true
    command: /bin/bash -c "apt-get update && apt-get install -y nmap hydra john hashcat aircrack-ng metasploit-framework && tail -f /dev/null"
    volumes:
      - kali_data:/root
      - wireless_captures:/captures
    restart: unless-stopped

  # LDAP Server (Active Directory simulation)
  ldap:
    image: osixia/openldap:1.5.0
    container_name: lab-ldap
    ports:
      - "389:389"
      - "636:636"
    environment:
      - LDAP_ORGANISATION=Enterprise Corp
      - LDAP_DOMAIN=enterprise.local
      - LDAP_ADMIN_PASSWORD=admin123
    restart: unless-stopped

  # Samba/SMB share (Windows-like file shares)
  samba:
    image: dperson/samba
    container_name: lab-samba
    ports:
      - "139:139"
      - "445:445"
    environment:
      - USER=admin;admin123
      - USER2=guest;guest
      - SHARE=public;/share;yes;no;no;all
      - SHARE2=confidential;/confidential;no;no;no;admin
    volumes:
      - samba_public:/share
      - samba_confidential:/confidential
    restart: unless-stopped

  # SNMP server (network device simulation)
  snmp:
    image: polinux/snmpd
    container_name: lab-snmp
    ports:
      - "161:161/udp"
    environment:
      - SNMP_COMMUNITY=public
    restart: unless-stopped

  # ============================================
  # TIER 7: RPC SERVICES (Remote Procedure Call)
  # ============================================

  # NFS Server (Network File System - RPC-based)
  nfs-server:
    image: itsthenetwork/nfs-server-alpine:latest
    container_name: lab-nfs
    privileged: true
    ports:
      - "2049:2049"
      - "111:111"
      - "111:111/udp"
    environment:
      - SHARED_DIRECTORY=/nfsshare
      - SYNC=true
      - PERMITTED="*"
    volumes:
      - nfs_data:/nfsshare
    restart: unless-stopped

  # Portmapper/rpcbind (RPC service discovery)
  rpcbind:
    image: alpine:3.18
    container_name: lab-rpcbind
    ports:
      - "112:111"
      - "112:111/udp"
    command: >
      sh -c "apk add --no-cache rpcbind &&
             rpcbind -f -w"
    privileged: true
    restart: unless-stopped

  # NIS/YP Server (Yellow Pages - legacy RPC auth)
  nis-server:
    image: alpine:3.18
    container_name: lab-nis
    ports:
      - "713:713"
      - "714:714/udp"
    command: >
      sh -c "apk add --no-cache ypserv ypbind rpcbind &&
             echo 'admin:$$6$$rounds=5000$$saltsalt$$hashhash:1000:1000:Admin:/home/admin:/bin/bash' > /etc/passwd.yp &&
             echo 'enterprise.local' > /etc/defaultdomain &&
             rpcbind && ypserv -d"
    privileged: true
    restart: unless-stopped

  # XML-RPC Service (vulnerable to various attacks)
  xmlrpc:
    build:
      context: ./services/xmlrpc
      dockerfile: Dockerfile
    container_name: lab-xmlrpc
    ports:
      - "8086:8086"
    restart: unless-stopped

  # JSON-RPC Service (Ethereum/Web3 style)
  jsonrpc:
    build:
      context: ./services/jsonrpc
      dockerfile: Dockerfile
    container_name: lab-jsonrpc
    ports:
      - "8087:8087"
    restart: unless-stopped

  # gRPC Service (modern RPC with vulnerabilities)
  grpc-server:
    build:
      context: ./services/grpc
      dockerfile: Dockerfile
    container_name: lab-grpc
    ports:
      - "50051:50051"
    restart: unless-stopped

  # D-Bus over TCP (unusual but exploitable)
  dbus-tcp:
    image: alpine:3.18
    container_name: lab-dbus
    ports:
      - "55556:55556"
    command: >
      sh -c "apk add --no-cache dbus socat &&
             socat TCP-LISTEN:55556,fork,reuseaddr UNIX-CONNECT:/var/run/dbus/system_bus_socket &
             dbus-daemon --system --nofork"
    privileged: true
    restart: unless-stopped

  # Java RMI Registry (classic RPC attack surface)
  java-rmi:
    image: eclipse-temurin:11-jdk
    container_name: lab-rmi
    ports:
      - "1099:1099"
      - "9999:9999"
    command: >
      sh -c "cat > /tmp/VulnServer.java << 'JAVA'
      import java.rmi.*;
      import java.rmi.registry.*;
      import java.rmi.server.*;

      interface VulnService extends Remote {
          String execute(String cmd) throws RemoteException;
          String readFile(String path) throws RemoteException;
          String getSystemInfo() throws RemoteException;
      }

      class VulnServiceImpl extends UnicastRemoteObject implements VulnService {
          VulnServiceImpl() throws RemoteException { super(); }

          public String execute(String cmd) throws RemoteException {
              try {
                  Process p = Runtime.getRuntime().exec(cmd);
                  java.io.BufferedReader r = new java.io.BufferedReader(
                      new java.io.InputStreamReader(p.getInputStream()));
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = r.readLine()) != null) sb.append(line).append(\"\\n\");
                  return sb.toString();
              } catch (Exception e) { return e.toString(); }
          }

          public String readFile(String path) throws RemoteException {
              try {
                  return new String(java.nio.file.Files.readAllBytes(java.nio.file.Paths.get(path)));
              } catch (Exception e) { return e.toString(); }
          }

          public String getSystemInfo() throws RemoteException {
              return \"Java RMI Server v1.0\\nOS: \" + System.getProperty(\"os.name\") +
                     \"\\nUser: \" + System.getProperty(\"user.name\") +
                     \"\\nSecret API Key: sk-12345-admin-secret\";
          }
      }

      public class VulnServer {
          public static void main(String[] args) throws Exception {
              System.setProperty(\"java.rmi.server.hostname\", \"0.0.0.0\");
              LocateRegistry.createRegistry(1099);
              VulnService service = new VulnServiceImpl();
              Naming.rebind(\"rmi://0.0.0.0:1099/VulnService\", service);
              System.out.println(\"RMI Server running on port 1099\");
              Thread.sleep(Long.MAX_VALUE);
          }
      }
      JAVA
      cd /tmp && javac VulnServer.java && java -Djava.rmi.server.hostname=0.0.0.0 VulnServer"
    restart: unless-stopped

  # Microsoft RPC simulation (DCE/RPC style)
  msrpc-sim:
    build:
      context: ./services/msrpc-sim
      dockerfile: Dockerfile
    container_name: lab-msrpc
    ports:
      - "135:135"
      - "593:593"
    restart: unless-stopped

  # ============================================
  # TIER 9: FAMOUS CVE EXPLOITS
  # ============================================

  # Log4Shell Vulnerable Service (CVE-2021-44228)
  # The most famous Java vulnerability - RCE via JNDI injection
  log4shell:
    build:
      context: ./services/log4shell
      dockerfile: Dockerfile
    container_name: lab-log4shell
    ports:
      - "8090:8090"
    restart: unless-stopped

  # Shellshock Vulnerable CGI (CVE-2014-6271)
  # Classic Bash vulnerability - RCE via environment variables
  shellshock:
    build:
      context: ./services/shellshock
      dockerfile: Dockerfile
    container_name: lab-shellshock
    ports:
      - "8093:80"
    restart: unless-stopped

  # Apache Struts RCE Simulation (CVE-2017-5638)
  # Content-Type OGNL injection - caused the Equifax breach
  struts-vuln:
    build:
      context: ./services/struts
      dockerfile: Dockerfile
    container_name: lab-struts
    ports:
      - "8091:8091"
    restart: unless-stopped

  # Deserialization Vulnerabilities (CWE-502)
  # Multiple deserialization vulns: Pickle, YAML, XXE, Eval
  deserialize-vuln:
    build:
      context: ./services/deserialize
      dockerfile: Dockerfile
    container_name: lab-deserialize
    ports:
      - "8092:8092"
    restart: unless-stopped

  # PHPMyAdmin with default credentials
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lab-phpmyadmin
    ports:
      - "8094:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=root123
    depends_on:
      - mysql
    restart: unless-stopped

  # Adminer (simpler DB admin, also common target)
  adminer:
    image: adminer:4.8.1
    container_name: lab-adminer
    ports:
      - "8095:8080"
    restart: unless-stopped

  # Spring Boot Actuator (exposed endpoints, info leak, RCE potential)
  spring-actuator:
    image: python:3.9-slim
    container_name: lab-spring-actuator
    ports:
      - "8096:8096"
    command: >
      sh -c "pip install flask && python -c \"
      from flask import Flask, jsonify
      import os, socket

      app = Flask(__name__)

      @app.route('/')
      def index():
          return '<h1>Employee API</h1><p>Spring Boot 2.3.0</p><a href=\"/actuator\">Actuator</a>'

      @app.route('/actuator')
      def actuator():
          return jsonify({
              '_links': {
                  'self': {'href': '/actuator'},
                  'health': {'href': '/actuator/health'},
                  'info': {'href': '/actuator/info'},
                  'env': {'href': '/actuator/env'},
                  'mappings': {'href': '/actuator/mappings'},
                  'heapdump': {'href': '/actuator/heapdump'},
                  'jolokia': {'href': '/actuator/jolokia'}
              }
          })

      @app.route('/actuator/health')
      def health():
          return jsonify({'status': 'UP'})

      @app.route('/actuator/env')
      def env():
          return jsonify({
              'activeProfiles': ['prod'],
              'propertySources': [
                  {'name': 'systemEnvironment', 'properties': {
                      'AWS_ACCESS_KEY_ID': {'value': 'AKIAIOSFODNN7EXAMPLE'},
                      'AWS_SECRET_ACCESS_KEY': {'value': 'wJalrXUtnFEMI/K7MDENG/bPxRfiCY'},
                      'DATABASE_URL': {'value': 'mysql://root:root123@mysql:3306/prod'},
                      'JWT_SECRET': {'value': 'super-secret-jwt-key-2024'},
                      'STRIPE_API_KEY': {'value': 'sk_live_51234567890abcdef'}
                  }}
              ]
          })

      @app.route('/actuator/info')
      def info():
          return jsonify({
              'app': {'name': 'employee-api', 'version': '2.3.0'},
              'git': {'commit': 'abc123', 'branch': 'main'},
              'build': {'artifact': 'employee-api', 'group': 'com.corp'}
          })

      @app.route('/actuator/mappings')
      def mappings():
          return jsonify({
              'contexts': {
                  'application': {
                      'mappings': {
                          '/api/admin/users': {'methods': ['GET', 'POST', 'DELETE']},
                          '/api/admin/config': {'methods': ['GET', 'PUT']},
                          '/api/internal/debug': {'methods': ['GET']},
                          '/api/v1/employees': {'methods': ['GET', 'POST']}
                      }
                  }
              }
          })

      if __name__ == '__main__':
          app.run(host='0.0.0.0', port=8096)
      \"
      "
    restart: unless-stopped

  # JNDI/LDAP Server for Log4Shell exploitation
  jndi-server:
    image: python:3.9-slim
    container_name: lab-jndi
    ports:
      - "1389:1389"
      - "8180:8180"
    command: >
      sh -c "pip install ldap3 flask && python -c \"
      from flask import Flask
      import threading
      import socket

      app = Flask(__name__)

      @app.route('/Exploit.class')
      def exploit_class():
          # Returns fake Java class that would execute commands
          return b'CAFEBABE00000034'

      @app.route('/callback')
      def callback():
          return 'JNDI callback received - RCE successful!'

      def fake_ldap():
          sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          sock.bind(('0.0.0.0', 1389))
          sock.listen(5)
          print('Fake LDAP server on 1389')
          while True:
              try:
                  conn, addr = sock.accept()
                  print(f'LDAP connection from {addr}')
                  # Send LDAP response pointing to HTTP server
                  response = b'\\x30\\x0c\\x02\\x01\\x01\\x61\\x07\\x0a\\x01\\x00\\x04\\x00\\x04\\x00'
                  conn.send(response)
                  conn.close()
              except: pass

      threading.Thread(target=fake_ldap, daemon=True).start()
      app.run(host='0.0.0.0', port=8180)
      \"
      "
    restart: unless-stopped

  # ProFTPd with mod_copy (CVE-2015-3306)
  proftpd-vuln:
    image: alpine:3.18
    container_name: lab-proftpd
    ports:
      - "2121:21"
    command: >
      sh -c "apk add --no-cache proftpd &&
             echo 'ServerName \"ProFTPD Vulnerable Server\"' > /etc/proftpd/proftpd.conf &&
             echo 'ServerType standalone' >> /etc/proftpd/proftpd.conf &&
             echo 'Port 21' >> /etc/proftpd/proftpd.conf &&
             echo 'Umask 022' >> /etc/proftpd/proftpd.conf &&
             echo 'MaxInstances 30' >> /etc/proftpd/proftpd.conf &&
             echo 'User nobody' >> /etc/proftpd/proftpd.conf &&
             echo 'Group nogroup' >> /etc/proftpd/proftpd.conf &&
             echo '<Anonymous /var/ftp>' >> /etc/proftpd/proftpd.conf &&
             echo '  User ftp' >> /etc/proftpd/proftpd.conf &&
             echo '  Group ftp' >> /etc/proftpd/proftpd.conf &&
             echo '  UserAlias anonymous ftp' >> /etc/proftpd/proftpd.conf &&
             echo '  RequireValidShell off' >> /etc/proftpd/proftpd.conf &&
             echo '  <Directory *>' >> /etc/proftpd/proftpd.conf &&
             echo '    <Limit WRITE>' >> /etc/proftpd/proftpd.conf &&
             echo '      AllowAll' >> /etc/proftpd/proftpd.conf &&
             echo '    </Limit>' >> /etc/proftpd/proftpd.conf &&
             echo '  </Directory>' >> /etc/proftpd/proftpd.conf &&
             echo '</Anonymous>' >> /etc/proftpd/proftpd.conf &&
             mkdir -p /var/ftp && chmod 777 /var/ftp &&
             echo 'SECRET_KEY=admin_password_123' > /var/ftp/config.txt &&
             adduser -D ftp &&
             proftpd -n"
    restart: unless-stopped

  # Memcached (no auth, often exposed)
  memcached:
    image: memcached:1.6-alpine
    container_name: lab-memcached
    ports:
      - "11211:11211"
    restart: unless-stopped

  # CouchDB (weak auth)
  couchdb:
    image: apache/couchdb:3.3
    container_name: lab-couchdb
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=admin
    restart: unless-stopped

  # RabbitMQ (default creds: guest/guest)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: lab-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: unless-stopped

  # ============================================
  # TIER 10: CLOUD METADATA SIMULATION
  # ============================================
  # Simulates AWS/GCP/Azure metadata services for SSRF training
  # In real pentests, these would be accessed via SSRF vulnerabilities

  cloud-metadata:
    build:
      context: ./services/cloud-metadata
      dockerfile: Dockerfile
    container_name: lab-cloud-metadata
    ports:
      - "8169:80"  # Simulates 169.254.169.254
    restart: unless-stopped

  # Kubernetes API simulation (often exposed accidentally)
  k8s-api-sim:
    image: python:3.9-slim
    container_name: lab-k8s-api
    ports:
      - "6443:6443"
      - "10250:10250"
    command: >
      sh -c "pip install flask && python -c \"
      from flask import Flask, jsonify
      app = Flask(__name__)

      @app.route('/api')
      def api():
          return jsonify({'versions': ['v1']})

      @app.route('/api/v1')
      def api_v1():
          return jsonify({
              'resources': [
                  {'name': 'pods', 'namespaced': True},
                  {'name': 'secrets', 'namespaced': True},
                  {'name': 'configmaps', 'namespaced': True},
                  {'name': 'services', 'namespaced': True}
              ]
          })

      @app.route('/api/v1/namespaces/kube-system/secrets')
      def kube_system_secrets():
          return jsonify({
              'items': [{
                  'metadata': {'name': 'admin-token-xxxxx'},
                  'data': {
                      'token': ''
                  }
              }]
          })

      @app.route('/api/v1/namespaces/default/pods')
      def default_pods():
          return jsonify({
              'items': [{
                  'metadata': {'name': 'web-app-7d8f9c6b5-xxxxx', 'namespace': 'default'},
                  'spec': {
                      'containers': [{
                          'name': 'web',
                          'image': 'company/web-app:v1.2.3',
                          'env': [
                              {'name': 'DATABASE_URL', 'value': 'postgres://admin:secret@db:5432/app'},
                              {'name': 'API_KEY', 'value': 'sk-prod-xxxxxxxxxxxx'}
                          ]
                      }]
                  }
              }]
          })

      @app.route('/healthz')
      def healthz():
          return 'ok'

      if __name__ == '__main__':
          import ssl
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.check_hostname = False
          context.verify_mode = ssl.CERT_NONE
          # Generate self-signed cert on the fly
          import subprocess
          subprocess.run(['openssl', 'req', '-x509', '-newkey', 'rsa:2048', '-keyout', '/tmp/key.pem', '-out', '/tmp/cert.pem', '-days', '365', '-nodes', '-subj', '/CN=kubernetes'], capture_output=True)
          context.load_cert_chain('/tmp/cert.pem', '/tmp/key.pem')
          app.run(host='0.0.0.0', port=6443, ssl_context=context)
      \"
      "
    restart: unless-stopped

  # Sun RPC (ONC RPC) - Classic Unix RPC
  sunrpc:
    image: alpine:3.18
    container_name: lab-sunrpc
    ports:
      - "113:111"
      - "113:111/udp"
      - "32765-32770:32765-32770"
    command: >
      sh -c "apk add --no-cache rpcbind nfs-utils &&
             echo '/share *(rw,sync,no_subtree_check,no_root_squash,insecure)' > /etc/exports &&
             mkdir -p /share && echo 'SECRET_DATA=admin_password_123' > /share/secret.txt &&
             rpcbind -w && rpc.nfsd && rpc.mountd &&
             exportfs -ra &&
             rpcinfo -p localhost &&
             tail -f /dev/null"
    privileged: true
    volumes:
      - sunrpc_share:/share
    restart: unless-stopped

  # ============================================
  # SSRF VULNERABLE SERVICE FOR TESTING
  # ============================================
  ssrf-vuln:
    build:
      context: ./services/ssrf-vuln
      dockerfile: Dockerfile
    container_name: lab-ssrf-vuln
    ports:
      - "8094:8094"
    restart: unless-stopped
    networks:
      - default

  # ============================================
  # TIER 11: MODERN API VULNERABILITIES
  # ============================================

  # GraphQL with introspection, injection, and DoS vectors
  graphql-vuln:
    build:
      context: ./services/graphql-vuln
      dockerfile: Dockerfile
    container_name: lab-graphql
    ports:
      - "5001:5001"
    restart: unless-stopped

  # OAuth/OIDC with open redirect, weak tokens, implicit flow
  oauth-vuln:
    build:
      context: ./services/oauth-vuln
      dockerfile: Dockerfile
    container_name: lab-oauth
    ports:
      - "5002:5002"
    restart: unless-stopped

  # ============================================
  # TIER 12: SENTINEL DARWIN - AUTONOMOUS SECURITY
  # ============================================

  # Sentinel Darwin - Self-defending security daemon
  sentinel-darwin:
    build:
      context: ../sentinel-darwin
      dockerfile: Dockerfile
    container_name: lab-sentinel-darwin
    hostname: sentinel-darwin
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
      - AUDIT_CONTROL
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SENTINEL_LOG_LEVEL=INFO
    volumes:
      - sentinel_data:/opt/sentinel/data
      - sentinel_logs:/var/log/sentinel
    restart: unless-stopped

  # Sentinel Threat Intel API
  sentinel-threat-api:
    build:
      context: ../sentinel-darwin
      dockerfile: Dockerfile.api
    container_name: lab-sentinel-api
    ports:
      - "8097:8095"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - sentinel_data:/opt/sentinel/data:ro
    restart: unless-stopped

volumes:
  wireless_captures:
  kali_data:
  samba_public:
  samba_confidential:
  jenkins_home:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  mysql_data:
  nfs_data:
  sunrpc_share:
  redis_ssh_data:
  sentinel_data:
  sentinel_logs:

