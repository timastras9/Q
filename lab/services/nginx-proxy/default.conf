server {
    listen 80;
    server_name localhost;

    # VULNERABILITY: Missing security headers
    # No X-Frame-Options
    # No X-Content-Type-Options
    # No Content-Security-Policy
    # No X-XSS-Protection

    # VULNERABILITY: Directory listing enabled
    autoindex on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # VULNERABILITY: Exposed nginx status
    location /nginx_status {
        stub_status on;
        # No access restriction!
    }

    # VULNERABILITY: Path traversal possible
    location /files {
        alias /etc/;
    }

    # VULNERABILITY: Exposed .git directory
    location ~ /\.git {
        # Should be denied but isn't
    }

    # VULNERABILITY: Proxy to internal services without auth
    location /internal-api/ {
        proxy_pass http://vulnerable-api:3000/;
        # No authentication required
    }

    location /jenkins/ {
        proxy_pass http://jenkins:8080/;
        # Exposes Jenkins internally
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/;
    }

    # VULNERABILITY: Debug endpoint exposed
    location /debug {
        return 200 '{"nginx_version": "$nginx_version", "server": "$server_name", "request_uri": "$request_uri", "remote_addr": "$remote_addr"}';
        add_header Content-Type application/json;
    }

    # VULNERABILITY: Backup files accessible
    location ~* \.(bak|backup|old|orig|save|swp|~)$ {
        # Should be denied but allows access
    }

    # VULNERABILITY: PHP source files accessible
    location ~* \.phps$ {
        # Exposes PHP source
    }

    # VULNERABILITY: Environment files
    location ~ /\.env {
        # Should be denied
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
