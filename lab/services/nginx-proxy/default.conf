server {
    listen 80;
    server_name localhost;

    # VULNERABILITY: Missing security headers
    autoindex on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /nginx_status {
        stub_status on;
    }

    location /files {
        alias /etc/;
    }

    location /debug {
        return 200 '{"nginx_version": "$nginx_version", "server": "$server_name", "request_uri": "$request_uri", "remote_addr": "$remote_addr"}';
        add_header Content-Type application/json;
    }

    location /internal-api/ {
        proxy_pass http://vulnerable-api:3000/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# HTTPS server with self-signed cert (vulnerable to MITM without verification)
server {
    listen 443 ssl;
    server_name localhost;

    # Self-signed certificate (vulnerable!)
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # VULNERABILITY: Weak SSL configuration - allows old TLS versions
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers 'ALL:!aNULL:!eNULL';
    ssl_prefer_server_ciphers off;

    # VULNERABILITY: Missing security headers on HTTPS too
    autoindex on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /nginx_status {
        stub_status on;
    }

    location /files {
        alias /etc/;
    }

    location /internal-api/ {
        proxy_pass http://vulnerable-api:3000/;
    }

    location /debug {
        return 200 '{"nginx_version": "$nginx_version", "server": "$server_name", "ssl": "enabled", "protocol": "$ssl_protocol", "cipher": "$ssl_cipher"}';
        add_header Content-Type application/json;
    }

    # Secret admin area (no proper auth)
    location /admin-secret/ {
        return 200 '{"admin_token": "super-secret-admin-token-12345", "db_password": "root123"}';
        add_header Content-Type application/json;
    }

    location /jenkins/ {
        proxy_pass http://jenkins:8080/;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
