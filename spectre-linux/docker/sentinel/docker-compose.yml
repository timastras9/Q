# Spectre - Docker Compose Configuration
# ===============================================
# Autonomous, self-healing security daemon for Linux
#
# Usage:
#   docker-compose up -d                    # Start Spectre
#   docker-compose logs -f spectre  # Watch logs
#   docker-compose exec spectre python3 /opt/spectre/daemon.py  # Manual scan

services:
  spectre:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spectre
    hostname: spectre
    restart: unless-stopped

    # Required for security scanning
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
      - AUDIT_CONTROL

    # Environment variables
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SPECTRE_LOG_LEVEL=INFO
      - TZ=UTC

    # Volumes for persistence
    volumes:
      - spectre-data:/opt/spectre/data
      - spectre-logs:/var/log/spectre
      - spectre-baseline:/opt/spectre/baseline
      - ./config:/opt/spectre/config:ro

    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "-f", "daemon.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Threat Intel API
  threat-intel-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: spectre-threat-intel
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - spectre-data:/opt/spectre/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  spectre-data:
    driver: local
  spectre-logs:
    driver: local
  spectre-baseline:
    driver: local
