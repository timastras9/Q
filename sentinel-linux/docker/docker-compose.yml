services:
  sentinel-linux:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-linux
    hostname: sentinel
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - TERM=xterm-256color
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Mount persistent data only (sentinel files copied during build)
      #- ../../sentinel:/opt/sentinel:ro
      # Persistent data
      - sentinel-data:/var/lib/sentinel
      # Logs accessible from host
      - ./logs:/var/log/sentinel
    ports:
      - "22:22"        # SSH
      - "80:80"        # HTTP
      - "6379:6379"    # Redis
      - "21:21"        # FTP
    networks:
      - sentinel-net
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  # Optional: Vulnerable targets for testing (from lab)
  vuln-redis:
    image: redis:6
    container_name: sentinel-test-redis
    command: redis-server --protected-mode no
    networks:
      - sentinel-net
    profiles:
      - lab

  vuln-mongo:
    image: mongo:4.4
    container_name: sentinel-test-mongo
    environment:
      - MONGO_INITDB_DATABASE=test
    networks:
      - sentinel-net
    profiles:
      - lab

  vuln-mysql:
    image: mysql:5.7
    container_name: sentinel-test-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=password123
      - MYSQL_DATABASE=testdb
    networks:
      - sentinel-net
    profiles:
      - lab

volumes:
  sentinel-data:
  sentinel-logs:

networks:
  sentinel-net:
    driver: bridge
