# Sentinel Linux Build Configuration
# ===================================

# Version
SENTINEL_VERSION="1.0.0"
SENTINEL_CODENAME="guardian"

# Architecture
ARCH="x86_64"

# Kernel
KERNEL_VERSION="6.6.10"
KERNEL_URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz"

# Base system (using Alpine as foundation for musl + small footprint)
ALPINE_VERSION="3.19"
ALPINE_MIRROR="https://dl-cdn.alpinelinux.org/alpine"

# Python (for Sentinel daemon)
PYTHON_VERSION="3.11"

# Toolchain
MUSL_VERSION="1.2.4"
BUSYBOX_VERSION="1.36.1"

# Security
SELINUX_ENABLED="yes"
HARDENED_KERNEL="yes"
SECURE_BOOT="yes"

# Sentinel
SENTINEL_DAEMON_PATH="/opt/sentinel"
SENTINEL_CONFIG_PATH="/etc/sentinel"
SENTINEL_LOG_PATH="/var/log/sentinel"
SENTINEL_DATA_PATH="/var/lib/sentinel"

# ISO
ISO_LABEL="SENTINEL_LINUX"
ISO_PUBLISHER="PentestAI"
ISO_APPLICATION="Sentinel Linux ${SENTINEL_VERSION}"

# Build paths
BUILD_ROOT="/tmp/sentinel-build"
ROOTFS_PATH="${BUILD_ROOT}/rootfs"
ISO_PATH="${BUILD_ROOT}/iso"

# Packages to include
CORE_PACKAGES="
    busybox
    musl
    musl-utils
    linux-firmware
    python3
    py3-pip
    py3-requests
    openssl
    ca-certificates
    curl
    jq
    iptables
    nftables
    iproute2
    procps
    util-linux
    shadow
    sudo
    openssh-server
    openssh-client
"

SECURITY_PACKAGES="
    audit
    aide
    fail2ban
    lynis
    openscap
    selinux-policy
"

SENTINEL_DEPENDENCIES="
    python3
    py3-pip
    py3-requests
    py3-cryptography
    nmap
"
